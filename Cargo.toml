[package]
name = "remotemic"
version = "1.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["goldpulpy"]
description = "LAN WebRTC microphone receiver for PipeWire/PulseAudio"
license = "MIT"
repository = "https://github.com/goldpulpy/remotemic"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
debug = false
rpath = false

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
futures-util = "0.3.32"
nix = { version = "0.31.3", default-features = false, features = ["fs", "net"] }
opus-rs = "0.1.33"
rand = "0.10.1"
rcgen = { version = "0.14.10", features = ["pem", "x509-parser"] }
rtc = "0.20.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.52.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webrtc = "0.20.5"
