name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check tag and package version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the vMAJOR.MINOR.PATCH format: ${tag}" >&2
            exit 1
          fi

          package_version="$(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "remotemic") | .version'
          )"
          if [[ "${tag}" != "v${package_version}" ]]; then
            echo "Tag ${tag} does not match Cargo.toml version ${package_version}" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Check installer
        run: |
          shellcheck scripts/install.sh
          sh scripts/install.sh --yes --dependencies-only

  build-release:
    name: Build and publish Linux x86_64
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y binutils musl-tools make

      - name: Build release binary
        run: make release

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          asset="remotemic-linux-x86_64"
          mkdir -p dist
          install -m 0755 target/x86_64-unknown-linux-musl/release/remotemic "dist/${asset}"
          cd dist
          sha256sum "${asset}" > "${asset}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RemoteMic ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/remotemic-linux-x86_64
            dist/remotemic-linux-x86_64.sha256
